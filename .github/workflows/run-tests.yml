#Runs all the tests! Triggers on push and PR for quick feedback.
#Tests are not very comprehensive right now, so don't put too much faith in this.
name: run tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Tools
        run: make prep

      - name: Execute tests
        run: |
          make test
          make testacc
          make test-releaser

      - name: Upload test artifacts for debugging
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-debug-artifacts
          path: |
            datasource/*/git_*_basic_test.pkr.hcl
            datasource/*/packer_log_git_*_basic_test.txt
          if-no-files-found: ignore
